services:
  # Python Backend
  - type: web
    name: wayconnect-backend
    plan: free
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -b 0.0.0.0:$PORT --worker-class gthread --threads 50 -w 1 app:app"
    rootDir: server-python
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///wayconnect.db
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false

  # React Frontend (Static Site)
  - type: web
    name: wayconnect-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: build
    rootDir: client
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: wayconnect-backend
          property: host
      - key: REACT_APP_SOCKET_URL
        fromService:
          type: web
          name: wayconnect-backend
          property: host
